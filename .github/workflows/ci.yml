name: SSP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p bridge_test.py -v
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  paper-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -f bridge/paper/pom.xml package

      - uses: actions/upload-artifact@v4
        with:
          name: ssp-paper-bridge
          path: bridge/paper/target/ssp-paper-bridge-0.1.0.jar
